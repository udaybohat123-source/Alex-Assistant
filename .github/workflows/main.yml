name: Build ALEX Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true; fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)")
          sed -i 's/firebaseBom = "[^"]*"/firebaseBom = "33.16.0"/' "$PROJECT_DIR/gradle/libs.versions.toml" || true
          gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALEX-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
